async function dash(){
  const d7=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  const [{data:r},{data:tx},{data:sc}]=await Promise.all([
    sb.from('readings').select('date,product,ltr,amount,test_ltr').gte('date',d7),
    pg('party_txn','type,amount'),
    sb.from('shift_close').select('*').order('id',{ascending:false}).limit(8)]);
  const td=(r||[]).filter(x=>x.date==today()),sum=(a,k)=>a.reduce((s,x)=>s+num(x[k]),0);
  const due=(tx||[]).reduce((s,x)=>s+(x.type=='credit'?1:-1)*num(x.amount),0);
  const days={};(r||[]).forEach(x=>days[x.date]=(days[x.date]||0)+num(x.amount));
  const mx=Math.max(1,...Object.values(days));
  $('#main').innerHTML=`<div class=g>
  <div class=card><span class=ic>💰</span>${t('today_sale')}<div class=big>${inr(sum(td,'amount'))}</div></div>
  <div class=card><span class=ic>⛽</span>Petrol (MS)<div class=big>${sum(td.filter(x=>x.product=='MS'),'ltr').toFixed(1)} L</div></div>
  <div class=card><span class=ic>🚚</span>Diesel (HSD)<div class=big>${sum(td.filter(x=>x.product=='HSD'),'ltr').toFixed(1)} L</div></div>
  ${S.cfg.nozzles.some(n=>n.p=='CNG')?`<div class=card><span class=ic>🔥</span>CNG<div class=big>${sum(td.filter(x=>x.product=='CNG'),'ltr').toFixed(1)} kg</div></div>`:''}
  <div class=card><span class=ic>🧪</span>Today's test (L)<div class=big>${sum(td,'test_ltr').toFixed(1)} L</div><small>returned to tank</small></div>
  <div class=card><span class=ic>📕</span>${t('credit_due')}<div class="big red">${inr(due)}</div></div></div>
  <div class=card><b>Today's report (DSR)</b> &nbsp;<button class=wa onclick="dayDSR()">📲 Send on WhatsApp</button> <small>all shifts total to owner</small></div>
  <div class=card><b>Last 7 days</b>${Object.keys(days).sort().map(k=>`<div>${k} ${inr(days[k])}<div class=bar style="width:${days[k]/mx*100}%"></div></div>`).join('')||'<p>No data yet</p>'}</div>
  <div class="card tw"><b>Recent shifts</b><table><tr><th>Date</th><th>Shift</th><th>Sale</th><th>Credit</th><th>PhonePe</th><th>UPI</th><th>HP Card</th><th>${t('cash')}</th><th>${t('shortage')}</th><th>By</th></tr>
  ${(sc||[]).map(x=>`<tr><td>${x.date}</td><td>${esc(x.shift)}</td><td>${inr(x.total_sale)}</td><td>${inr(x.credit)}</td><td>${inr(x.phonepe)}</td><td>${inr(x.upi)}</td><td>${inr(x.hpcard)}</td><td>${inr(x.cash_counted)}</td><td class="${x.shortage>0?'red':'grn'}">${inr(x.shortage)}</td><td>${esc(x.closed_by)}</td>${S.me?.role=='owner'?`<td><button title="Delete shift" onclick="dShift(${x.id})">🗑</button></td>`:''}</tr>`).join('')}</table></div>`;
}

const NI={dash:'📊',shift:'⛽',stock:'🛢️',lube:'🧴',staff:'👷',books:'📒',parties:'🤝',reports:'📈',recon:'🏦',settings:'⚙️',users:'👥'};
const prods=()=>[...new Set(S.cfg.nozzles.map(n=>n.p))];
async function shiftPage(){
  const {data}=await sb.from('readings').select('nozzle,closing').order('date',{ascending:false}).order('id',{ascending:false}).limit(100);
  const last={};(data||[]).forEach(r=>{if(!(r.nozzle in last))last[r.nozzle]=r.closing});
  const [{data:ps},{data:li}]=await Promise.all([sb.from('parties').select('id,name').order('name'),sb.from('lube_items').select('id,name,price,unit').eq('active',true).order('name')]);S.parties=ps||[];S.lubes=li||[];
  const c=S.cfg,own=S.me?.role=='owner',who=S.me?.name||S.me?.email||'';
  $('#main').innerHTML=`<div class=card><h3>${t('shift')}</h3><div class=row>
  <label>Date<input type=date id=sd value="${today()}"></label>
  <label>Shift<select id=ss>${c.shifts.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>

  <label>Closed by<input id=cb value="${esc(who)}" readonly></label></div>

  ${c.nozzles.map(n=>`<tr data-n="${n.id}" data-p="${n.p}"><td>${esc(n.n||n.id)}</td><td><input type=number step=.01 class=o value="${last[n.id]??0}" ${(n.id in last)&&!own?'readonly style="background:#eef"':''} oninput=calc()></td>
  <td><input type=number step=.01 class=cl oninput=calc()></td><td><input type=number step=.01 min=0 max=${c.test_max||10} class=ts value=0 oninput=calc()></td><td class=l>0</td><td class=a>0</td></tr>`).join('')}</table></div>
  <small>Opening comes automatically from the last closing (only Owner can change it). Test = fuel drawn to test the pump (poured back into tank), not counted in sale. Max test ${c.test_max||10} L per nozzle. Only Owner can change rates in Settings.</small></div>
  <div class=card><b>🧴 Lubricant / mobil oil sale (this shift)</b><div id=lu></div><button onclick=addLu()>+ Lube line</button></div>

  <div class=card><b>Expenses (paid from cash: gift, tea, repair etc.)</b><div id=ex></div><button onclick=addEx()>+ Expense line</button></div>

function addCr(){
  $('#cr').insertAdjacentHTML('beforeend',`<div class="row crl"><label>Party<select class=cp>${S.parties.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select></label><label>${t('amount')}<input type=number class=ca oninput=calc()></label></div>`);

function addEx(){
  $('#ex').insertAdjacentHTML('beforeend',`<div class="row exl"><label>Type<select class=ec>${EXP.map(c=>`<option>${c}</option>`).join('')}</select></label><label>${t('amount')}<input type=number class=ea oninput=calc()></label><label>Paid to / for<input class=en></label></div>`);
}
function calc(){
  let tot=0;
  document.querySelectorAll('tr[data-n]').forEach(tr=>{
    const o=num(tr.querySelector('.o').value),cl=tr.querySelector('.cl').value,ts=num(tr.querySelector('.ts').value),rate=num($('#r_'+tr.dataset.p).value);
    const l=cl===''?0:num(cl)-o-ts,a=l*rate;tr.querySelector('.l').textContent=l.toFixed(2);tr.querySelector('.a').textContent=a.toFixed(2);tot+=a;
  });
  const lu=[...document.querySelectorAll('.lul')].reduce((a,d)=>{const it=S.lubes.find(x=>x.id==d.querySelector('.lp').value);return a+num(d.querySelector('.lq').value)*num(it?.price)},0);tot+=lu;
  const sx=s=>[...document.querySelectorAll(s)].reduce((a,e)=>a+num(e.value),0),cr=sx('.ca'),ex=sx('.ea'),dg=num($('#pe').value)+num($('#upi').value)+num($('#hp').value),exp=tot-cr-dg-ex,sh=exp-num($('#cc').value);
  window.T={tot,cr,ex,exp,sh,lu,dg};
  $('#sum').innerHTML=`<div class=sum><div>Total sale<b>${inr(tot)}</b></div><div>Lube<b>${inr(lu)}</b></div><div>Credit<b>${inr(cr)}</b></div><div>PhonePe/UPI/HP card<b>${inr(dg)}</b></div><div>Expenses<b>${inr(ex)}</b></div><div>Expected cash<b>${inr(exp)}</b></div><div>${t('shortage')}<b class="${sh>0?'red':'grn'}">${inr(sh)}</b></div></div>`;
}
async function saveShift(){
  const date=$('#sd').value,shift=$('#ss').value,who=$('#cb').value,rows=[];
  if(S.me?.role=='owner'){const nr={...S.cfg.rates};let ch=0;prods().forEach(p=>{const v=num($('#r_'+p)?.value);if(v&&v!=nr[p]){nr[p]=v;ch=1}});if(ch){S.cfg={...S.cfg,rates:nr};const{error}=await sb.from('pump_settings').upsert({id:1,data:S.cfg});if(error)return alert(error.message)}}
  for(const tr of document.querySelectorAll('tr[data-n]')){
    const cl=tr.querySelector('.cl').value;if(cl==='')continue;
    const o=num(tr.querySelector('.o').value),c=num(cl),ts=num(tr.querySelector('.ts').value);
    if(c<o+ts) return alert('Closing is less than opening + test: '+tr.dataset.n);
    if(ts<0||(S.me?.role!='owner'&&ts>(S.cfg.test_max||10))) return alert('Test litres cannot exceed '+(S.cfg.test_max||10)+' L: '+tr.dataset.n);
    const rate=num($('#r_'+tr.dataset.p).value),l=c-o-ts;
    rows.push({date,shift,nozzle:tr.dataset.n,product:tr.dataset.p,opening:o,closing:c,test_ltr:ts,ltr:l,rate,amount:l*rate});
  }
  if(!rows.length) return alert('Enter closing readings');
  if(rows.some(r=>r.rate<=0)&&!confirm('A product rate is 0. Save anyway?'))return;
  const {data:dup}=await sb.from('shift_close').select('id').eq('date',date).eq('shift',shift);
  if(dup?.length&&!confirm('This shift is already saved. Save again?'))return;
  calc();let e=(await sb.from('readings').insert(rows)).error;
  const tx=[...document.querySelectorAll('.crl')].map(d=>({party_id:+d.querySelector('.cp').value,date,type:'credit',amount:num(d.querySelector('.ca').value),note:'Shift '+shift})).filter(x=>x.amount>0&&x.party_id);
  if(!e&&tx.length)e=(await sb.from('party_txn').insert(tx)).error;
  const ex=[...document.querySelectorAll('.exl')].map(d=>({date,book:'cash',type:'out',category:d.querySelector('.ec').value,amount:num(d.querySelector('.ea').value),note:'Shift '+shift+(d.querySelector('.en').value?': '+d.querySelector('.en').value:''),by_name:who})).filter(x=>x.amount>0);
  if(!e&&ex.length)e=(await sb.from('ledger_entries').insert(ex)).error;
  const lu=[...document.querySelectorAll('.lul')].map(d=>{const it=S.lubes.find(x=>x.id==d.querySelector('.lp').value),q=num(d.querySelector('.lq').value);return it&&q>0?{item_id:it.id,date,type:'sale',qty:q,rate:num(it.price),amount:q*num(it.price),shift,by_name:who}:null}).filter(Boolean);
  if(!e&&lu.length)e=(await sb.from('lube_txn').insert(lu)).error;
  const sc={date,shift,total_sale:T.tot,lube:T.lu,credit:T.cr,upi:num($('#upi').value),phonepe:num($('#pe').value),hpcard:num($('#hp').value),expense:T.ex,expected_cash:T.exp,cash_counted:num($('#cc').value),shortage:T.sh,closed_by:who};
  if(!e)e=(await sb.from('shift_close').insert(sc)).error;
  e?alert(e.message):showDSR(sc,rows);
}

async function partiesPage(){
  const [{data:ps},{data:tx}]=await Promise.all([sb.from('parties').select('*').order('name'),pg('party_txn','party_id,type,amount')]);
  const bal={};(tx||[]).forEach(x=>bal[x.party_id]=(bal[x.party_id]||0)+(x.type=='credit'?1:-1)*num(x.amount));
  $('#main').innerHTML=`<div class=card><h3>New party</h3><div class=row><label>Name<input id=pn></label><label>Phone<input id=pp></label><label>Vehicle no.<input id=pv></label><label>Limit<input type=number id=pl></label></div><button class=p onclick=addParty()>Add</button></div>
  <div class="card tw"><table><tr><th>Party</th><th>Phone</th><th>Limit</th><th>Due</th></tr>${(ps||[]).map(p=>`<tr><td><a href=# onclick="ledger(${p.id});return false">${esc(p.name)}</a><br><small>${esc(p.vehicle)}</small></td><td>${esc(p.phone)}</td><td>${inr(p.credit_limit)}</td><td class="${bal[p.id]>p.credit_limit&&p.credit_limit>0?'red':''}">${inr(bal[p.id])}</td></tr>`).join('')}</table></div><div id=led></div>`;
}
async function addParty(){
  if(!$('#pn').value.trim())return alert('Name required');
  const {error}=await sb.from('parties').insert({name:$('#pn').value.trim(),phone:$('#pp').value,vehicle:$('#pv').value,credit_limit:num($('#pl').value)});
  error?alert(error.message):partiesPage();
}
async function ledger(id){
  const {data}=await sb.from('party_txn').select('*').eq('party_id',id).order('date').order('id');let b=0;
  $('#led').innerHTML=`<div class="card tw"><h3>Ledger</h3><div class=row><label>Date<input type=date id=pd value="${today()}"></label><label>Payment received<input type=number id=pa></label><label>Note<input id=pt></label></div><button class=p onclick="recv(${id})">Receive</button>
  <table><tr><th>Date</th><th>Note</th><th>Credit</th><th>Paid</th><th>Balance</th></tr>${(data||[]).map(x=>{b+=(x.type=='credit'?1:-1)*num(x.amount);return `<tr><td>${x.date}</td><td>${esc(x.note)}</td><td>${x.type=='credit'?inr(x.amount):''}</td><td>${x.type=='payment'?inr(x.amount):''}</td><td>${inr(b)}</td>${del('party_txn',x.id)}</tr>`}).join('')}</table></div>`;
}
async function recv(id){
  const a=num($('#pa').value);if(a<=0)return alert('Enter amount');
  const {error}=await sb.from('party_txn').insert({party_id:id,date:$('#pd').value,type:'payment',amount:a,note:$('#pt').value||'Payment received'});
  error?alert(error.message):partiesPage().then(()=>ledger(id));
}

function settingsPage(){
  const c=S.cfg;
  $('#main').innerHTML=`<div class=card><h3>${t('settings')}</h3><div class=row><label>Pump name<input id=s_name value="${esc(c.name)}"></label><label>Phones<input id=s_ph value="${esc(c.phones)}"></label></div>
  <div class=row><label>Address<input id=s_ad value="${esc(c.address)}"></label><label>GSTIN / VAT (later)<input id=s_gs value="${esc(c.gstin)}"></label></div>
  <div class=row><label>Oil company<input id=s_co value="${esc(c.company||'HPCL')}"></label><label>Owner WhatsApp (for reports)<input id=s_wa value="${esc(c.owner_wa||'')}" placeholder="10 digit"></label><label>Test max (L/nozzle)<input type=number id=s_tm value="${c.test_max||10}"></label></div>
  <div class=row><label>MS rate<input type=number step=.01 id=s_ms value="${c.rates.MS}"></label><label>HSD rate<input type=number step=.01 id=s_hs value="${c.rates.HSD}"></label><label>CNG rate/kg<input type=number step=.01 id=s_cg value="${c.rates.CNG||0}"></label></div>
  <label>Shifts (one per line)<textarea id=s_sh rows=3>${esc(c.shifts.join('\n'))}</textarea></label><br><br>
  <label>Nozzles (JSON: id, p=MS/HSD/CNG, n=display name)<textarea id=s_nz rows=8>${esc(JSON.stringify(c.nozzles,null,1))}</textarea></label><br><br>
  <button class=p onclick=saveSettings()>${t('save')}</button></div>`;
}
async function saveSettings(){
  let nz;try{nz=JSON.parse($('#s_nz').value)}catch(e){return alert('Nozzle JSON error')}
  S.cfg={...S.cfg,name:$('#s_name').value,phones:$('#s_ph').value,address:$('#s_ad').value,gstin:$('#s_gs').value,company:$('#s_co').value.trim()||'HPCL',owner_wa:$('#s_wa').value.replace(/\D/g,'').slice(-10),test_max:num($('#s_tm').value)||10,rates:{MS:num($('#s_ms').value),HSD:num($('#s_hs').value),CNG:num($('#s_cg').value)},shifts:$('#s_sh').value.split('\n').map(s=>s.trim()).filter(Boolean),nozzles:nz};
  const {error}=await sb.from('pump_settings').upsert({id:1,data:S.cfg});
  error?alert(error.message):(alert('Saved'),shell(),go('settings'));
}
async function backup(){
  const out={};for(const k of['pump_settings','readings','shift_close','parties','party_txn','dips','purchases','ledger_entries','staff','attendance','staff_pay','lube_items','lube_txn'])out[k]=(await pg(k,'*')).data;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='pump-backup-'+today()+'.json';a.click();
}
